<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 540" width="512" height="540">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E6B4F"/>
      <stop offset="100%" stop-color="#1F4D37"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E3C565"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
  </defs>

  <!-- Shield outline -->
  <path d="M256 20 L430 68 V 228 C 430 324 356 388 256 436 C 156 388 82 324 82 228 V 68 Z"
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="18" stroke-linejoin="round"/>

  <!-- Inner shield line -->
  <path d="M256 56 L402 98 V 224 C 402 306 338 360 256 402 C 174 360 110 306 110 224 V 98 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-opacity="0.6" stroke-linejoin="round"/>

  <!-- Heart -->
  <path d="M256 208
           C 256 186 232 166 206 166
           C 178 166 160 186 160 212
           C 160 248 198 276 256 308
           C 314 276 352 248 352 212
           C 352 186 334 166 306 166
           C 280 166 256 186 256 208 Z"
        fill="url(#goldGrad)"/>

  <!-- Wordmark -->
  <text x="256" y="486" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="64" font-weight="bold" letter-spacing="4"
        fill="url(#goldGrad)">Maruvaidyam</text>
</svg>
